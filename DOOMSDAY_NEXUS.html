function chrome(content){const p=PAGES.find(p=>p[0]===state.page)||PAGES[0];const nav=PAGES.map(([id,name,ico],idx)=>`${idx===3?'<div class="nav-divider"></div><div class="nav-label">FERRAMENTAS</div>':''}<button class="nav-item${state.page===id?' active':''}" data-action="nav" data-page="${id}" title="${name}" aria-label="${name}" ${state.page===id?'aria-current="page"':''}>${icon(ico)}<span>${name}</span></button>`).join('');return `<div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-icon">${icon('circle')}</div><div><div class="brand-name">DOOMSDAY<span>NEXUS</span></div><div class="brand-meta">TEMPORAL INTELLIGENCE</div></div></div><div class="nav-label">PLATAFORMA</div><nav class="nav" aria-label="Menu principal">${nav}</nav><div class="sidebar-bottom"><div class="sidebar-unit"><div class="orbit-small">◉ CALENDÁRIO GREGORIANO</div><p>601 anos de possibilidades. Um único algoritmo para dominá-los.</p><div class="progress-track"><span style="width:${Math.min(100,pct(metrics().total,600))}%"></span></div><div class="info-line" style="margin-top:9px">${num(metrics().total)} datas praticadas</div></div></div><div class="sidebar-footer"><span class="status-dot"></span> NEXUS ENGINE / v1.0</div></aside><main class="main"><header class="topbar"><div class="bread">NEXUS <span>/</span><strong>${p[1].toUpperCase()}</strong></div><div class="top-right"><span class="live"><span class="status-dot"></span> SISTEMA ATIVO</span><span class="top-chip">1500 — 2100</span></div></header><div class="content screen">${state.warning?`<div class="error-alert" role="alert">${state.warning}</div>`:''}${content}<p class="footer-note">DOOMSDAY NEXUS · Sistema matemático de Conway · Calendário gregoriano proléptico, inclusive antes de 1582.</p></div></main></div>`;}
function pageHead(eyebrow,title,description,tag){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${description}</p></div>${tag?`<div class="right-tag">${tag}</div>`:''}</div>`;}
function kpi(title,value,foot,ic){return `<div class="panel kpi"><div class="kpi-top">${title}<span class="kpi-icon">${icon(ic)}</span></div><div class="kpi-val">${value}</div><div class="kpi-foot">${foot}</div></div>`;}
function plotChart(rows){if(rows.length===0)return `<div class="chart-blank">Ainda sem sessões concluídas.<br/>Finalize um treino para acompanhar a evolução.</div>`;const width=580,height=190,left=35,right=15,top=18,bottom=25;const plotW=width-left-right,plotH=height-top-bottom;const coords=rows.map((r,i)=>[left+(rows.length===1?plotW/2:i*plotW/(rows.length-1)),top+plotH-(r.accuracy/100)*plotH]);const points=coords.map(p=>p.map(x=>x.toFixed(1)).join(',')).join(' ');const area=`M ${coords[0][0]} ${top+plotH} L ${coords.map(p=>p.join(' ')).join(' L ')} L ${coords.at(-1)[0]} ${top+plotH} Z`;return `<svg viewBox="0 0 ${width} ${height}" class="line-chart" role="img" aria-label="Gráfico de precisão das últimas ${rows.length} sessões">${[0,25,50,75,100].map(n=>{const y=top+plotH-n/100*plotH;return `<line x1="${left}" y1="${y}" x2="${width-right}" y2="${y}" stroke="rgba(78,136,203,.15)" stroke-dasharray="3 6"/><text x="25" y="${y+3}" text-anchor="end" fill="#6483a5" font-size="10" font-family="monospace">${n}</text>`;}).join('')}<defs><linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#00d9ff" stop-opacity=".21"/><stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#chartFill)"/><polyline points="${points}" fill="none" stroke="#00d9ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${coords.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="4" fill="#00d9ff" stroke="#07152b" stroke-width="2"><title>Sessão ${i+1}: ${rows[i].accuracy}%</title></circle>`).join('')}${coords.map(([x],i)=>(i===0||i===coords.length-1||rows.length<=5)?`<text x="${x}" y="${height-5}" text-anchor="middle" fill="#6483a5" font-size="10" font-family="monospace">${i+1}</text>`:'').join('')}</svg>`;}
function renderDashboard(){const m=metrics();const recent=last(saved.sessions,12);const desc=`Converta qualquer data em seu dia da semana usando lógica, padrões e cálculo mental. Sem decorar calendários.`;return `<section class="hero"><div class="hero-copy"><div class="eyebrow">MATHEMATICAL INTELLIGENCE SYSTEM</div><h1>O TEMPO É<br/><em>UM PADRÃO.</em></h1><p class="hero-description">${desc}</p><div class="hero-actions"><button class="btn btn-primary" data-action="nav" data-page="training">${icon('play')} INICIAR TREINAMENTO ${icon('arrow')}</button><button class="btn btn-ghost" data-action="nav" data-page="lab">${icon('atom')} EXPLORAR LABORATÓRIO</button></div><div class="hero-micro"><b>●</b> ALGORITMO DE CONWAY &nbsp; / &nbsp; ${num(219511)} DATAS VÁLIDAS</div></div><div class="hero-wheel">${wheel(state.wheelDay)}</div></section><section class="kpis">${kpi('Precisão geral',m.total?m.accuracy+'%':'—','ACERTOS / TENTATIVAS','target')}${kpi('Tempo médio',m.total?formatSeconds(m.avg):'—','POR RESPOSTA','timer')}${kpi('Datas resolvidas',num(m.total),'TOTAL DE QUESTÕES','calendar')}${kpi('Melhor sequência',num(m.streak),'ACERTOS CONSECUTIVOS','bolt')}</section><div class="section-grid"><section class="panel"><div class="panel-head"><div><div class="panel-title">Evolução da precisão</div><div class="panel-sub">SUAS ÚLTIMAS 12 SESSÕES · % DE ACERTOS</div></div><button class="small-link" data-action="nav" data-page="performance">VER ANÁLISE ${icon('arrow')}</button></div><div class="panel-body">${plotChart(recent)}</div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">Seu próximo desafio</div><div class="panel-sub">TREINO DE ALTA PERFORMANCE</div></div>${icon('brain')}</div><div class="panel-body"><div class="mini-row"><span class="index">01</span><div><strong>Treinamento personalizado</strong><small>Escolha períodos e limites</small></div><button class="small-link" data-action="nav" data-page="training">ABRIR</button></div><div class="mini-row"><span class="index">02</span><div><strong>Speed Challenge</strong><small>20 datas contra o cronômetro</small></div><button class="small-link" data-action="nav" data-page="speed">ABRIR</button></div><div class="mini-row"><span class="index">03</span><div><strong>Laboratório do Doomsday</strong><small>Âncoras e cálculo guiado</small></div><button class="small-link" data-action="nav" data-page="lab">ABRIR</button></div></div></section></div>`;}
function field(name,label,inner){return `<div class="field"><label for="${name}">${label}</label>${inner}</div>`;}
function options(values,current){return values.map(([v,t])=>`<option value="${v}"${selected(v,current)}>${t}</option>`).join('');}
const RANGE_OPTIONS=[['all','Todo o período · 1500–2100'],['1500','1500–1599'],['1600','1600–1699'],['1700','1700–1799'],['1800','1800–1899'],['1900','1900–1999'],['2000','2000–2099'],['custom','Intervalo personalizado']];
const SELECTION_OPTIONS=[['random','Datas completamente aleatórias'],['chrono','Ordem cronológica'],['fixedmonth','Mês fixo, anos aleatórios'],['fixedyear','Ano fixo, dias variados'],['leap','Somente anos bissextos'],['nonleap','Somente anos não bissextos'],['errors','Revisar datas erradas']];
function trainingSettings(){const n=state;return `${pageHead('CALCULAR · APRENDER · DOMINAR','Treinamento mental','Configure sua sessão. Cada questão apresenta uma data válida e mede sua precisão e velocidade.','MODO / TREINAMENTO')}<div class="config-grid"><section class="panel form-panel"><h2 class="section-title">Configuração da sessão</h2><p class="section-description">Selecione como o Nexus deve gerar os seus desafios.</p><div class="field-grid">${field('train-range','Período histórico',`<select id="train-range" data-config="trainRange">${options(RANGE_OPTIONS,n.trainRange)}</select>${n.trainRange==='custom'?`<div class="inline-fields"><input aria-label="Ano inicial" id="train-start" type="number" min="1500" max="2100" value="${n.trainStart}"/><span>até</span><input aria-label="Ano final" id="train-end" type="number" min="1500" max="2100" value="${n.trainEnd}"/></div>`:''}`)}${field('train-count','Quantidade de questões',`<select id="train-count" data-config="trainCount">${options([['5','5 questões'],['10','10 questões'],['20','20 questões'],['50','50 questões'],['unlimited','Ilimitado']],n.trainCount)}</select>`)}${field('train-selection','Seleção de datas',`<select id="train-selection" data-config="trainSelection">${options(SELECTION_OPTIONS,n.trainSelection)}</select>${n.trainSelection==='fixedmonth'?`<div class="inline-fields"><select id="train-month" aria-label="Mês fixo">${D.MONTHS.map((m,i)=>`<option value="${i+1}"${selected(i+1,n.trainMonth)}>${m}</option>`).join('')}</select></div>`:''}${n.trainSelection==='fixedyear'?`<div class="inline-fields"><input id="train-year" type="number" min="1500" max="2100" aria-label="Ano fixo" value="${n.trainYear}"/></div>`:''}`)}${field('train-timer','Limite por questão',`<select id="train-timer" data-config="trainTimer">${options([['0','Sem limite'],['5','5 segundos'],['10','10 segundos'],['15','15 segundos'],['20','20 segundos'],['30','30 segundos'],['custom','Tempo personalizado']],n.trainTimer)}</select>${n.trainTimer==='custom'?`<div class="inline-fields"><input id="train-custom-timer" type="number" min="1" max="3600" value="${n.trainCustomTimer}" aria-label="Limite de tempo em segundos"/></div>`:''}`)}</div><hr class="panel-divider"/><div class="hint">${icon('info')} As respostas ficam ocultas até a sua tentativa. Use as teclas <b>1–7</b> para responder, <b>Enter</b> para avançar e <b>Espaço</b> para pausar.</div><button class="btn btn-primary btn-full" data-action="start-training">${icon('play')} COMEÇAR TREINAMENTO ${icon('arrow')}</button></section><aside class="panel side-info"><div class="eyebrow">SISTEMA DOOMSDAY</div><div class="metric">MOD 7</div><h3 class="section-title">Um algoritmo. 601 anos.</h3><p>Treine a decomposição de anos, as datas-âncora e a aritmética modular para calcular o dia da semana de cabeça.</p><hr class="panel-divider"/><div class="info-line">INTERVALO <b>1500 — 2100</b></div><div class="info-line">CALENDÁRIO <b>GREGORIANO</b></div><div class="info-line">MÉTODO <b>CONWAY</b></div><div class="info-line">PROGRESSO <b>SALVO LOCALMENTE</b></div></aside></div>`;}
function speedSettings(){const levels=[['easy','Fácil','Somente datas-âncora do mês. Identificação direta do Doomsday.'],['medium','Médio','Datas a 1, 2 ou 3 dias das âncoras mensais.'],['hard','Difícil','Qualquer data válida entre 1500 e 2100.']];return `${pageHead('VELOCIDADE · PRECISÃO · FOCO','Speed Challenge','Descubra o dia da semana de 20 datas em sequência. Acompanhe seus tempos em centésimos.','MODO / 20 QUESTÕES')}<div class="speed-intro"><section class="panel form-panel"><h2 class="section-title">Escolha o nível</h2><p class="section-description">A dificuldade depende da distância entre a data sorteada e a âncora do mês.</p><div class="mode-strip">${levels.map(([v,t])=>`<button class="mode-pill${state.speedLevel===v?' selected':''}" data-action="speed-level" data-value="${v}">${t.toUpperCase()}</button>`).join('')}</div><div class="speed-levels">${levels.map(([v,t,d])=>`<div class="speed-level" style="${v===state.speedLevel?'border-color:rgba(0,217,255,.6)':''}"><b class="${v===state.speedLevel?'cyan':''}">${t}</b><p>${d}</p></div>`).join('')}</div><div class="hint">${icon('bolt')} Tempo medido a cada questão. O resultado só aparece após a resposta. Sem penalidade adicional de tempo.</div><button class="btn btn-primary" data-action="start-speed">${icon('bolt')} INICIAR DESAFIO ${icon('arrow')}</button></section><aside class="panel speed-visual"><div><div class="eyebrow" style="text-align:center">PRECISÃO CENTESIMAL</div><div class="speed-timer-big">00,00<span style="font-size:18px">s</span></div><div class="muted mono" style="text-align:center;font-size:10px">20 RODADAS · SEM LIMITE</div></div></aside></div>`;}
function randomInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function randomDate(min,max,options={}){const y=options.year??randomInt(min,max),m=options.month??randomInt(1,12),d=randomInt(1,D.daysInMonth(m,y));return {d,m,y};}
function rangeFromState(){if(state.trainRange==='all')return [1500,2100];if(state.trainRange==='custom')return [Number($('#train-start')?.value),Number($('#train-end')?.value)];const start=Number(state.trainRange);return [start,start+99];}
function collectTrainingConfig(){const [min,max]=rangeFromState();if(!Number.isInteger(min)||!Number.isInteger(max)||min<1500||max>2100||min>max)return {error:'O intervalo deve conter anos inteiros de 1500 até 2100, em ordem crescente.'};const selection=state.trainSelection, month=Number($('#train-month')?.value||state.trainMonth),fixedYear=Number($('#train-year')?.value||state.trainYear);if(selection==='fixedyear'&&(!Number.isInteger(fixedYear)||fixedYear<min||fixedYear>max))return {error:`O ano fixo deve estar entre ${min} e ${max}.`};if(selection==='fixedmonth'&&(month<1||month>12))return {error:'Selecione um mês válido.'};let seconds=state.trainTimer==='custom'?Number($('#train-custom-timer')?.value):Number(state.trainTimer);if(!Number.isFinite(seconds)||seconds<0||seconds>3600||(state.trainTimer==='custom'&&seconds<1))return {error:'O cronômetro personalizado deve estar entre 1 e 3600 segundos.'};if(selection==='leap'&&!Array.from({length:max-min+1},(_,i)=>min+i).some(D.isLeapYear))return {error:'O intervalo escolhido não possui anos bissextos.'};if(selection==='nonleap'&&!Array.from({length:max-min+1},(_,i)=>min+i).some(y=>!D.isLeapYear(y)))return {error:'O intervalo escolhido não possui anos comuns.'};if(selection==='errors'&&!saved.history.some(r=>!r.correct&&r.year>=min&&r.year<=max))return {error:'Ainda não há datas erradas nesse intervalo. Faça um treino normal primeiro.'};return {min,max,selection,month,fixedYear,seconds,limit:state.trainCount==='unlimited'?Infinity:Number(state.trainCount)};}
function candidateDate(s){if(s.type==='speed'){const level=s.config.level;if(level==='hard')return randomDate(1500,2100);for(let i=0;i<100;i++){const y=randomInt(1500,2100),m=randomInt(1,12),anchor=D.monthAnchor(m,y);const delta=level==='easy'?0:randomInt(1,3)*(Math.random()<.5?-1:1);const d=anchor+delta;if(D.isValidDate(d,m,y))return {d,m,y};}return {d:10,m:10,y:2026};}
const {min,max,selection,month,fixedYear}=s.config;
if(selection==='chrono'){if(s.lastDate){let next=D.nextDate(s.lastDate.d,s.lastDate.m,s.lastDate.y);if(next.y<min||next.y>max)next={d:1,m:1,y:min};return next;}return randomDate(min,max);}
if(selection==='fixedmonth')return randomDate(min,max,{month});
if(selection==='fixedyear')return randomDate(min,max,{year:fixedYear});
if(selection==='errors'){const pool=saved.history.filter(r=>!r.correct&&r.year>=min&&r.year<=max);if(pool.length){const r=pool[randomInt(0,pool.length-1)];return {d:r.day,m:r.month,y:r.year};}}
if(selection==='leap'||selection==='nonleap'){const years=[];for(let y=min;y<=max;y++)if(D.isLeapYear(y)===(selection==='leap'))years.push(y);return randomDate(min,max,{year:years[randomInt(0,years.length-1)]});}
return randomDate(min,max);
}
function newQuestion(s){let next=candidateDate(s);for(let k=0;k<14 && s.lastDate && next.d===s.lastDate.d&&next.m===s.lastDate.m&&next.y===s.lastDate.y&&s.config.selection!=='chrono';k++)next=candidateDate(s);s.lastDate=next;s.current=next;s.questionIndex++;s.result=null;s.paused=false;s.pausedAt=null;s.pausedAccum=0;s.startedAt=performance.now();state.showSolution=false;}
function startSession(type){if(type==='training'){const cfg=collectTrainingConfig();if(cfg.error){state.warning=cfg.error;render();return;}state.session={type,config:cfg,limit:cfg.limit,questionIndex:0,logs:[],correct:0,finished:false,paused:false};state.page='training';}else{state.session={type,config:{level:state.speedLevel,seconds:0,selection:'speed'},limit:20,questionIndex:0,logs:[],correct:0,finished:false,paused:false};state.page='speed';}state.warning='';newQuestion(state.session);render();}
function elapsed(s){if(!s||!s.startedAt)return 0;const now=s.paused?s.pausedAt:performance.now();return Math.max(0,(now-s.startedAt-s.pausedAccum)/1000);}
function pauseToggle(){const s=state.session;if(!s||s.finished||s.result)return;if(s.paused){s.pausedAccum+=performance.now()-s.pausedAt;s.paused=false;s.pausedAt=null;}else{s.pausedAt=performance.now();s.paused=true;}render();}
function answerQuestion(answer){const s=state.session;if(!s||s.finished||s.result||s.paused)return;const q=s.current;const correctIdx=D.weekday(q.d,q.m,q.y),seconds=elapsed(s),correct=answer===correctIdx;const rec={ts:new Date().toISOString(),day:q.d,month:q.m,year:q.y,answer,weekday:correctIdx,seconds:Number(seconds.toFixed(3)),correct,mode:s.type};s.result=rec;s.logs.push(rec);if(correct)s.correct++;saved.history.push(rec);if(saved.history.length>6000)saved.history=saved.history.slice(-6000);save();render();}
function finishSession(){const s=state.session;if(!s||s.finished)return;s.finished=true;const answered=s.logs.filter(r=>r.answer!==null);const entry={ts:new Date().toISOString(),mode:s.type,level:s.type==='speed'?s.config.level:'custom',total:s.logs.length,correct:s.correct,accuracy:pct(s.correct,s.logs.length),average:answered.length?answered.reduce((v,r)=>v+r.seconds,0)/answered.length:0};if(s.logs.length){saved.sessions.push(entry);if(saved.sessions.length>800)saved.sessions=saved.sessions.slice(-800);save();}render();}
function nextQuestion(){const s=state.session;if(!s||!s.result)return;if(s.questionIndex>=s.limit){finishSession();return;}newQuestion(s);render();}
function solutionHtml(r){const q=D.getReasoning(r.day,r.month,r.year);return `<div class="solution"><h3>${icon('layers')} Cálculo de Conway, passo a passo</h3><div class="solution-step"><span class="step-num">1</span><p>Século <b>${q.century}</b>: âncora <b>${D.DAYS[q.base]} (${q.base})</b>.</p></div><div class="solution-step"><span class="step-num">2</span><p>Últimos dois algarismos: <b>Y = ${q.yy}</b>. A = ⌊${q.yy} ÷ 12⌋ = <b>${q.a}</b>; B = ${q.yy} mod 12 = <b>${q.b}</b>; C = ⌊${q.b} ÷ 4⌋ = <b>${q.c}</b>.</p></div><div class="solution-step"><span class="step-num">3</span><p>Doomsday = (${q.base} + ${q.a} + ${q.b} + ${q.c}) mod 7 = <b>${q.doom} (${D.DAYS[q.doom]})</b>.</p></div><div class="solution-step"><span class="step-num">4</span><p>Âncora de ${D.MONTHS[q.month-1]}: <b>${String(q.anchor).padStart(2,'0')}/${String(q.month).padStart(2,'0')}</b>${q.month<=2?` · ${q.leap?'ano bissexto':'ano comum'}`:''}.</p></div><div class="solution-step"><span class="step-num">5</span><p>Diferença: <b>${q.day} − ${q.anchor} = ${q.delta}</b> dias; deslocamento módulo 7: <b>${q.offset}</b>.</p></div><div class="solution-step"><span class="step-num">6</span><p>(${q.doom} + ${q.delta}) mod 7 = <b>${q.result}</b> → <b>${D.DAYS[q.result]}</b>.</p></div></div>`;}
function resultHtml(r){const successful=r.correct;const timedOut=r.answer===null;return `<section class="result-card" aria-live="assertive"><div class="result-head"><div class="result-symbol${successful?'':' fail'}">${icon(successful?'check':timedOut?'timer':'cross')}</div><div><strong class="${successful?'good':'bad'}">${successful?'Resposta correta!':timedOut?'Tempo esgotado':'Resposta incorreta'}</strong><small>Dia correto: ${D.DAYS[r.weekday]}${!successful&&!timedOut?` · sua escolha: ${D.DAYS[r.answer]}`:''}</small></div><div class="result-time">${formatSeconds(r.seconds)}</div></div><div class="result-actions"><button class="btn btn-ghost btn-sm" data-action="toggle-solution">${icon('eye')} ${state.showSolution?'OCULTAR':'VER'} RACIOCÍNIO</button><button class="btn btn-primary" data-action="next-question">${state.session.questionIndex>=state.session.limit?'FINALIZAR SESSÃO':'PRÓXIMA DATA'} ${icon('arrow')}</button></div>${state.showSolution?solutionHtml(r):''}</section>`;}
function practiceScreen(s){if(s.finished)return sessionSummary(s);const q=s.current, result=s.result,limit=s.config.seconds;const n=s.questionIndex;return `<div class="practice-layout">${pageHead(s.type==='speed'?'CHALLENGE / CHRONOMETRIC MODE':'TREINO / TEMPORAL ENGINE',s.type==='speed'?'Desafio de velocidade':'Treinamento em andamento','Resolva a data mentalmente e marque um dos sete dias da semana.',s.type==='speed'?'PRECISÃO / 0,01s':'CÁLCULO / MOD 7')}<div class="practice-top"><span class="practice-status">QUESTÃO <b>${String(n).padStart(2,'0')}</b> / ${Number.isFinite(s.limit)?String(s.limit).padStart(2,'0'):'∞'}</span><span class="practice-status">ACERTOS <b>${s.correct}</b> · PRECISÃO <b>${pct(s.correct,s.logs.length)}%</b></span><button class="btn btn-ghost btn-sm" data-action="pause">${icon(s.paused?'play':'pause')} ${s.paused?'RETOMAR':'PAUSAR'}</button></div><div class="practice-progress"><span style="width:${Number.isFinite(s.limit)?pct(s.logs.length,s.limit):0}%"></span></div><section class="practice-card"><div class="timer-panel"><span class="timer-desc">TEMPO DE RESPOSTA</span><div class="timer-block" id="live-timer">${icon('timer')}<span class="timer-digits">${formatSeconds(result?result.seconds:0)}</span></div>${limit?`<span class="timer-desc">LIMITE: ${limit}s</span>`:'<span class="timer-desc">SEM LIMITE</span>'}</div><div class="practice-eyebrow">QUAL É O DIA DA SEMANA?</div><div class="practice-date">${String(q.d).padStart(2,'0')} <span>/</span> ${String(q.m).padStart(2,'0')} <span>/</span> ${q.y}</div><div class="practice-caption">${D.MONTHS[q.m-1].toUpperCase()} · ${q.y} · CALENDÁRIO GREGORIANO</div><div class="answers" role="group" aria-label="Selecione o dia da semana">${D.DAYS.map((day,i)=>`<button class="answer${result?(result.weekday===i?' correct':result.answer===i?' wrong':''):''}" data-action="answer" data-value="${i}" ${result||s.paused?'disabled':''}><span class="key">${i+1}</span><span class="day-name">${day.replace('-feira','')}</span></button>`).join('')}</div>${result?resultHtml(result):`<div class="note" style="text-align:center;margin-top:21px">USE AS TECLAS 1–7 PARA RESPONDER · ESPAÇO PARA PAUSAR</div>`}${s.paused?`<div class="paused-cover"><div class="eyebrow">SESSÃO EM ESPERA</div><h2>Treino pausado</h2><p class="muted">O cronômetro está parado.</p><button class="btn btn-primary" data-action="pause">${icon('play')} RETOMAR</button></div>`:''}</section>${s.type==='training'?`<div class="row-between margin-top"><button class="btn btn-ghost btn-sm" data-action="reset-training">${icon('settings')} NOVA CONFIGURAÇÃO</button><button class="btn btn-danger btn-sm" data-action="end-session">ENCERRAR SESSÃO</button></div>`:`<div class="row-between margin-top"><button class="btn btn-ghost btn-sm" data-action="reset-speed">${icon('rotate')} ALTERAR DIFICULDADE</button><button class="btn btn-danger btn-sm" data-action="end-session">ENCERRAR DESAFIO</button></div>`}</div>`;}
function sessionSummary(s){const answered=s.logs.filter(r=>r.answer!==null),avg=answered.length?answered.reduce((a,r)=>a+r.seconds,0)/answered.length:0,best=answered.filter(r=>r.correct).map(r=>r.seconds);return `<div class="practice-layout">${pageHead('RELATÓRIO / SESSÃO CONCLUÍDA','Desafio finalizado','Seu desempenho foi salvo neste navegador.','RESULTADO FINAL')}<section class="panel session-done"><div class="done-ring">${pct(s.correct,s.logs.length)}%</div><div class="eyebrow">MISSÃO CONCLUÍDA</div><h2>${s.correct} acertos em ${s.logs.length} ${s.logs.length===1?'data':'datas'}</h2><p class="muted">${s.type==='speed'?'Speed Challenge':'Treinamento'} · ${new Date().toLocaleDateString('pt-BR')}</p><div class="done-metrics"><div>${formatSeconds(avg)}<small>TEMPO MÉDIO</small></div><div>${best.length?formatSeconds(Math.min(...best)):'—'}<small>MELHOR ACERTO</small></div><div>${s.logs.length-s.correct}<small>ERROS / TEMPO ESGOTADO</small></div></div><div class="hero-actions" style="justify-content:center"><button class="btn btn-primary" data-action="replay">${icon('rotate')} TREINAR NOVAMENTE</button><button class="btn btn-ghost" data-action="nav" data-page="performance">${icon('chart')} VER DESEMPENHO</button></div></section></div>`;}
function labCenturies(){const centuries=[1500,1600,1700,1800,1900,2000,2100];return `<div class="lab-panel panel"><div class="eyebrow">MÓDULO 01 / CICLOS DE 400 ANOS</div><h2>Âncoras dos séculos</h2><p>O calendário gregoriano repete seu padrão de dias da semana a cada <b class="cyan">400 anos</b>. Basta memorizar quatro âncoras fundamentais.</p><div class="century-grid">${centuries.map(y=>`<div class="century-card"><div class="century">${y}</div><div class="anch">${D.centuryAnchor(y)}</div><div class="anch-day">${D.DAYS[D.centuryAnchor(y)]}</div></div>`).join('')}</div><div class="section-grid"><div><h3 class="section-title">Convenção módulo 7</h3><p class="muted" style="font-size:12px;line-height:1.8">Domingo = 0 · Segunda = 1 · Terça = 2 · Quarta = 3 · Quinta = 4 · Sexta = 5 · Sábado = 6. Clique em um setor do círculo para visualizar o valor.</p><div class="formula">Séculos: <span class="accent">2 → 0 → 5 → 3 → 2...</span><br/>O padrão se repete a cada <span class="accent">400 anos</span>.</div></div><div class="calc-visual" style="min-height:230px">${wheel(state.wheelDay,true)}</div></div></div>`;}
function labMethod(){const y=state.labMethodResult??2026,q=D.getReasoning(10,10,y);return `<section class="panel lab-panel"><div class="eyebrow">MÓDULO 02 / DECOMPOSIÇÃO DO ANO</div><h2>Como calcular o Doomsday</h2><p>Separe os dois últimos algarismos do ano e aplique quatro operações simples. O resultado é o dia da semana de todas as datas-âncora daquele ano.</p><div class="formula"><span class="accent">Doomsday</span> = (âncora do século + ⌊Y/12⌋ + (Y mod 12) + ⌊(Y mod 12)/4⌋) mod 7</div><div class="labsplit"><div><div class="field" style="max-width:280px"><label for="lab-year">ANO PARA DECOMPOR (1500–2100)</label><input id="lab-year" type="number" min="1500" max="2100" value="${state.labYear}"/></div><button class="btn btn-primary margin-top" data-action="lab-year">${icon('calc')} DECOMPOR ANO</button><div class="hint">Exemplo: 2026 → 26 ÷ 12 = 2, resto 2; ⌊2 ÷ 4⌋ = 0; âncora 2000 = 2. Logo: (2+2+2+0) mod 7 = 6, sábado.</div></div><div class="panel padded" style="box-shadow:none"><div class="eyebrow">DECOMPOSIÇÃO / ${y}</div><div class="mini-row"><strong>Âncora ${q.century}</strong><div class="mini-value">${q.base}</div></div><div class="mini-row"><strong>Y (últimos dígitos)</strong><div class="mini-value">${q.yy}</div></div><div class="mini-row"><strong>A = ⌊Y / 12⌋</strong><div class="mini-value">${q.a}</div></div><div class="mini-row"><strong>B = Y mod 12</strong><div class="mini-value">${q.b}</div></div><div class="mini-row"><strong>C = ⌊B / 4⌋</strong><div class="mini-value">${q.c}</div></div><div class="mini-row"><strong>Doomsday</strong><div class="mini-value cyan">${q.doom} · ${DAY_ABBR[q.doom]}</div></div></div></div></section>`;}
function labMonths(){const year=state.labYear,leap=D.isLeapYear(year);return `<section class="panel lab-panel"><div class="eyebrow">MÓDULO 03 / MEMORIZAÇÃO VISUAL</div><h2>Datas-âncora dos meses</h2><p>Em cada ano, estas 12 datas caem no mesmo dia da semana: o Doomsday. Janeiro e fevereiro mudam nos anos bissextos.</p><div class="row-between" style="flex-wrap:wrap"><span class="muted mono" style="font-size:11px">Exibição: ${leap?'ano bissexto':'ano comum'} (${year})</span><button class="btn btn-soft btn-sm" data-action="toggle-anchors">${icon('eye')} ${state.hideAnchors?'MOSTRAR TODAS':'MODO MEMORIZAÇÃO'}</button></div><div class="anchor-grid">${D.MONTHS.map((name,i)=>{const key=i+1,anchor=D.monthAnchor(key,year),blur=state.hideAnchors&&!state.revealedAnchors.has(key);return `<button class="anchor-card${blur?' hidden-anchor':' reveal'}" data-action="reveal-anchor" data-value="${key}" aria-label="${name}: revelar a data-âncora"><span>${String(key).padStart(2,'0')} / ${name.toUpperCase()}</span><b>${String(anchor).padStart(2,'0')}/${String(key).padStart(2,'0')}</b></button>`;}).join('')}</div><div class="hint">${icon('brain')} Padrões úteis: 04/04, 06/06, 08/08, 10/10 e 12/12. Para as datas ímpares: 09/05, 05/09, 11/07 e 07/11.</div><div class="row-between" style="flex-wrap:wrap"><div class="field" style="width:170px"><label for="lab-month-year">ANO DE REFERÊNCIA</label><input type="number" id="lab-month-year" min="1500" max="2100" value="${year}"/></div><button class="btn btn-ghost btn-sm" data-action="lab-month-year">ALTERAR ANO</button></div></section>`;}
function labLeap(){const y=state.leapResult??state.leapYear,show=state.leapResult!==null,valid=Number.isInteger(y)&&y>=1500&&y<=2100,leap=valid&&D.isLeapYear(y);return `<section class="panel lab-panel"><div class="eyebrow">MÓDULO 04 / DIVISIBILIDADE</div><h2>Anos bissextos</h2><p>O calendário gregoriano possui uma exceção nos anos de século. A regra garante a repetição do ciclo a cada 400 anos.</p><ol class="rule-list"><li>Se o ano é divisível por <b>400</b>, é bissexto.</li><li>Se é divisível por <b>100</b>, mas não por 400, <b>não</b> é bissexto.</li><li>Nos demais casos, é bissexto somente se for divisível por <b>4</b>.</li></ol><div class="labsplit"><div><div class="field" style="max-width:250px"><label for="leap-year">TESTAR ANO</label><input type="number" min="1500" max="2100" id="leap-year" value="${state.leapYear}"/></div><button class="btn btn-primary margin-top" data-action="check-leap">${icon('check')} VERIFICAR ANO</button>${show?`<div class="${leap?'good-alert':'hint'}"><strong>${y} ${leap?'é':'não é'} bissexto.</strong> ${leap?'Fevereiro tem 29 dias.':'Fevereiro tem 28 dias.'} ${y%100===0?`Como ${y}${y%400===0?' é':' não é'} divisível por 400, a regra secular se aplica.`:`${y}${y%4===0?' é':' não é'} divisível por 4.`}</div>`:''}</div><div class="panel padded" style="box-shadow:none"><h3 class="section-title">Casos para memorizar</h3>${[1600,1700,1800,1900,2000,2100].map(a=>`<div class="mini-row"><strong>${a}</strong><span class="${D.isLeapYear(a)?'good':'bad'} mono" style="font-size:11px">${D.isLeapYear(a)?'BISSEXTO':'COMUM'}</span></div>`).join('')}</div></div></section>`;}
function dateForm(prefix,date){return `<div class="date-entry"><div><label for="${prefix}-day">DIA</label><input id="${prefix}-day" type="number" min="1" max="31" value="${date.d}" inputmode="numeric"/></div><div><label for="${prefix}-month">MÊS</label><input id="${prefix}-month" type="number" min="1" max="12" value="${date.m}" inputmode="numeric"/></div><div><label for="${prefix}-year">ANO</label><input id="${prefix}-year" type="number" min="1500" max="2100" value="${date.y}" inputmode="numeric"/></div></div>`;}
function labSteps(){return `<section class="panel lab-panel"><div class="eyebrow">MÓDULO 05 / SOLUÇÃO GUIADA</div><h2>Raciocínio passo a passo</h2><p>Digite qualquer data válida e acompanhe como o Doomsday é calculado, desde a âncora do século até o deslocamento modular.</p><div style="max-width:580px">${dateForm('lab-date',state.labDate)}<button class="btn btn-primary" data-action="lab-date">${icon('calc')} RESOLVER PASSO A PASSO</button>${state.labResult?`<div class="calc-result"><div class="date">${D.fmtDate(state.labResult.day,state.labResult.month,state.labResult.year)}</div><div class="weekday">${D.DAYS[D.weekday(state.labResult.day,state.labResult.month,state.labResult.year)]}</div>${solutionHtml(state.labResult)}</div>`:''}</div></section>`;}
function renderLab(){let body=state.labTab==='century'?labCenturies():state.labTab==='method'?labMethod():state.labTab==='months'?labMonths():state.labTab==='leap'?labLeap():labSteps();return `${pageHead('MATEMÁTICA / CONWAY METHOD','Laboratório do Doomsday','Domine o algoritmo por partes: séculos, decomposição, datas-âncora e aritmética modular.','5 MÓDULOS INTERATIVOS')}<div class="lab-tabs">${[['century','01 · Séculos'],['method','02 · Cálculo do ano'],['months','03 · Âncoras mensais'],['leap','04 · Bissextos'],['steps','05 · Resolução guiada']].map(([id,t])=>`<button class="lab-tab${state.labTab===id?' active':''}" data-action="lab-tab" data-value="${id}">${t}</button>`).join('')}</div>${body}`;}
function renderCalculator(){let r=state.calcResult;return `${pageHead('MÓDULO / CONSULTA EXATA','Calculadora temporal','Consulte qualquer data entre 01/01/1500 e 31/12/2100. Veja o resultado e explore o cálculo completo.','CALENDÁRIO / GREGORIANO')}<div class="config-grid"><section class="panel form-panel"><div class="eyebrow">INSERIR COORDENADA TEMPORAL</div><h2 style="font-size:22px;margin:13px 0 21px">Qual dia da semana?</h2>${dateForm('calc',state.calcDate)}<button class="btn btn-primary btn-full" data-action="calculate">${icon('calc')} CALCULAR DIA DA SEMANA ${icon('arrow')}</button><div class="note">Os anos 1500–1582 seguem o calendário gregoriano proléptico, mesmo antes de sua adoção histórica.</div>${r?`<section class="calc-result"><div class="date">RESULTADO · ${D.fmtDate(r.day,r.month,r.year)}</div><div class="weekday">${D.DAYS[D.weekday(r.day,r.month,r.year)]}</div><div class="result-small">Valor modular ${D.weekday(r.day,r.month,r.year)} · ${D.MONTHS[r.month-1]} · ${r.year}</div><button class="btn btn-ghost btn-sm margin-top" data-action="calc-reason">${icon('eye')} ${state.showCalcReason?'OCULTAR':'VER'} RACIOCÍNIO</button>${state.showCalcReason?solutionHtml(r):''}</section>`:`<div class="hint">${icon('info')} Digite uma data e clique em calcular para ver o dia correspondente. Nenhuma consulta é adicionada às estatísticas de treino.</div>`}</section><aside class="panel calc-visual">${wheel(r?D.weekday(r.day,r.month,r.year):state.wheelDay,true)}</aside></div>`;}
function bucketBars(records,field,labels){return labels.map(([value,name])=>{const matches=records.filter(r=>field(r)===value),hits=matches.filter(r=>r.correct).length;return `<div class="bar-row"><span class="name">${name}</span><span class="track"><span style="width:${pct(hits,matches.length)}%"></span></span><span class="pct">${matches.length?pct(hits,matches.length)+'%':'—'}</span></div>`;}).join('');}
function renderPerformance(){const m=metrics(),s=last(saved.sessions,12),months=D.MONTHS.map((v,i)=>[i+1,v.slice(0,3).toUpperCase()]),centuries=[1500,1600,1700,1800,1900,2000,2100].map(y=>[y,String(y)]);return `${pageHead('METRICS / COGNITIVE ANALYTICS','Meu desempenho','Acompanhe sua evolução e descubra os períodos em que pode melhorar sua precisão.','DADOS SALVOS LOCALMENTE')}<div class="perf-grid">${[['Questões resolvidas',num(m.total),'TOTAL'],['Acertos',num(m.correct),'RESPOSTAS CORRETAS'],['Erros / tempo esgotado',num(m.errors),'RESPOSTAS NÃO CORRETAS'],['Precisão',m.total?m.accuracy+'%':'—','TAXA GLOBAL'],['Tempo médio',m.total?formatSeconds(m.avg):'—','RESPOSTAS ENVIADAS'],['Melhor tempo',m.best!==null?formatSeconds(m.best):'—','ACERTO MAIS RÁPIDO']].map(([k,v,f])=>`<div class="panel perf-card"><div class="key">${k}</div><div class="val">${v}</div><div class="foot">${f}</div></div>`).join('')}</div><div class="section-grid"><section class="panel"><div class="panel-head"><div><div class="panel-title">Evolução por sessão</div><div class="panel-sub">PRECISÃO / ÚLTIMAS 12 SESSÕES</div></div></div><div class="panel-body">${plotChart(s)}</div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">Por século</div><div class="panel-sub">TAXA DE ACERTOS / APTIDÃO HISTÓRICA</div></div></div><div class="panel-body">${bucketBars(saved.history,r=>Math.floor(r.year/100)*100,centuries)}</div></section></div><div class="section-grid"><section class="panel"><div class="panel-head"><div><div class="panel-title">Precisão por mês</div><div class="panel-sub">IDENTIFICAÇÃO DE PADRÕES DE DIFICULDADE</div></div></div><div class="panel-body" style="display:grid;grid-template-columns:1fr 1fr;column-gap:18px">${bucketBars(saved.history,r=>r.month,months)}</div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">Revisão inteligente</div><div class="panel-sub">FOQUE NAS DATAS QUE VOCÊ ERROU</div></div></div><div class="panel-body"><p class="muted" style="font-size:12px;line-height:1.85">${m.errors?`Você possui ${m.errors} tentativas não corretas. O Nexus pode sortear essas datas novamente para reforçar sua memória.`:'Ainda não há erros registrados. Continue treinando para construir seu perfil de aprendizado.'}</p><button class="btn btn-soft" data-action="review-errors" ${m.errors?'':'disabled'}>${icon('target')} TREINAR MEUS ERROS</button><div class="hint">${icon('brain')} Melhor sequência até agora: <b>${m.streak} acertos seguidos.</b></div></div></section></div><section class="panel margin-top"><div class="panel-head"><div><div class="panel-title">Últimas tentativas</div><div class="panel-sub">REGISTROS DE TREINAMENTO E SPEED CHALLENGE</div></div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" data-action="export">${icon('download')} EXPORTAR CSV</button><button class="btn btn-danger btn-sm" data-action="clear-data">${icon('trash')} LIMPAR</button></div></div><div class="panel-body">${!saved.history.length?`<div class="empty-state">${icon('chart')}<strong>Seu histórico começa no primeiro treino.</strong>Resolva algumas datas para desbloquear esta análise.</div>`:`<div class="table-wrap"><table class="history-table"><thead><tr><th>DATA</th><th>RESULTADO</th><th>TEMPO</th><th>MODO</th><th>REGISTRO</th></tr></thead><tbody>${last(saved.history,15).reverse().map(r=>`<tr><td>${D.fmtDate(r.day,r.month,r.year)}</td><td><span class="${r.correct?'good':'bad'}">${r.correct?'ACERTO':r.answer===null?'TEMPO':'ERRO'}</span></td><td>${formatSeconds(r.seconds)}</td><td>${r.mode==='speed'?'VELOCIDADE':'TREINO'}</td><td>${new Date(r.ts).toLocaleDateString('pt-BR')}</td></tr>`).join('')}</tbody></table></div>`}</div></section>`;}
function render(){const content=state.page==='dashboard'?renderDashboard():state.page==='training'?(state.session?.type==='training'?practiceScreen(state.session):trainingSettings()):state.page==='speed'?(state.session?.type==='speed'?practiceScreen(state.session):speedSettings()):state.page==='lab'?renderLab():state.page==='calculator'?renderCalculator():renderPerformance();$('#app').innerHTML=chrome(content);updateTimer();}
function dateFromInputs(prefix){const d=Number($(`#${prefix}-day`)?.value),m=Number($(`#${prefix}-month`)?.value),y=Number($(`#${prefix}-year`)?.value);return {d,m,y};}
function validDateOrWarn(date){if(!D.isValidDate(date.d,date.m,date.y)){state.warning='Data inválida. Verifique dia, mês, ano (1500–2100) e a regra dos anos bissextos.';render();return false;}state.warning='';return true;}
function navigate(page){if(!PAGES.some(p=>p[0]===page))return;const s=state.session;if(s&&!s.finished&&!s.result&&!s.paused){s.paused=true;s.pausedAt=performance.now();}state.page=page;state.warning='';render();window.scrollTo({top:0,behavior:'instant'});}
function csvExport(){const header=['Data','Modo','Resposta','Dia correto','Acertou','Tempo (s)','Registrado em'];const data=saved.history.map(r=>[D.fmtDate(r.day,r.month,r.year),r.mode,r.answer===null?'Sem resposta':D.DAYS[r.answer],D.DAYS[r.weekday],r.correct?'Sim':'Não',String(r.seconds).replace('.',','),r.ts]);const csv='\uFEFF'+[header,...data].map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='doomsday-nexus-historico.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);}
function action(a,el){switch(a){
case 'nav':navigate(el.dataset.page);break;
case 'wheel-day':state.wheelDay=Number(el.dataset.value);if(state.page==='dashboard'||state.page==='lab'||state.page==='calculator')render();break;
case 'start-training':startSession('training');break;
case 'start-speed':startSession('speed');break;
case 'speed-level':state.speedLevel=el.dataset.value;render();break;
case 'pause':pauseToggle();break;
case 'answer':answerQuestion(Number(el.dataset.value));break;
case 'toggle-solution':state.showSolution=!state.showSolution;render();break;
case 'next-question':nextQuestion();break;
case 'end-session':finishSession();break;
case 'reset-training':if(state.session&&!state.session.finished&&state.session.logs.length)finishSession();state.session=null;state.page='training';render();break;
case 'reset-speed':if(state.session&&!state.session.finished&&state.session.logs.length)finishSession();state.session=null;state.page='speed';render();break;
case 'replay':startSession(state.session.type);break;
case 'lab-tab':state.labTab=el.dataset.value;state.warning='';render();break;
case 'lab-year':{const y=Number($('#lab-year')?.value);if(!Number.isInteger(y)||y<1500||y>2100){state.warning='Digite um ano de 1500 a 2100.';}else{state.labYear=y;state.labMethodResult=y;state.warning='';}render();break;}
case 'toggle-anchors':state.hideAnchors=!state.hideAnchors;state.revealedAnchors.clear();render();break;
case 'reveal-anchor':state.revealedAnchors.add(Number(el.dataset.value));render();break;
case 'lab-month-year':{const y=Number($('#lab-month-year')?.value);if(!Number.isInteger(y)||y<1500||y>2100)state.warning='Ano inválido: escolha de 1500 a 2100.';else{state.labYear=y;state.warning='';state.revealedAnchors.clear();}render();break;}
case 'check-leap':{const y=Number($('#leap-year')?.value);if(!Number.isInteger(y)||y<1500||y>2100)state.warning='Ano inválido: escolha de 1500 a 2100.';else{state.leapYear=y;state.leapResult=y;state.warning='';}render();break;}
case 'lab-date':{const dt=dateFromInputs('lab-date');if(!validDateOrWarn(dt))return;state.labDate=dt;state.labResult={day:dt.d,month:dt.m,year:dt.y};render();break;}
case 'calculate':{const dt=dateFromInputs('calc');if(!validDateOrWarn(dt))return;state.calcDate=dt;state.calcResult={day:dt.d,month:dt.m,year:dt.y};state.wheelDay=D.weekday(dt.d,dt.m,dt.y);state.showCalcReason=false;render();break;}
case 'calc-reason':state.showCalcReason=!state.showCalcReason;render();break;
case 'review-errors':state.trainRange='all';state.trainSelection='errors';state.session=null;navigate('training');break;
case 'export':csvExport();break;
case 'clear-data':if(window.confirm('Apagar permanentemente todo o seu histórico de treinamento e desempenho deste navegador?')){saved={history:[],sessions:[]};save();state.warning='';render();}break;
}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled){action(el.dataset.action,el);}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.config){const k=el.dataset.config;state[k]=el.value;render();}else{if(el.id==='train-month')state.trainMonth=el.value;if(el.id==='train-year')state.trainYear=el.value;if(el.id==='train-custom-timer')state.trainCustomTimer=el.value;if(el.id==='train-start')state.trainStart=Number(el.value);if(el.id==='train-end')state.trainEnd=Number(el.value);}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='train-start')state.trainStart=Number(el.value);if(el.id==='train-end')state.trainEnd=Number(el.value);if(el.id==='train-year')state.trainYear=el.value;if(el.id==='train-custom-timer')state.trainCustomTimer=el.value;});
document.addEventListener('keydown',e=>{const tag=e.target?.tagName?.toLowerCase();if((tag==='input'||tag==='select'||tag==='textarea')&&e.key!=='Escape')return;if(e.key==='Escape'){if(state.showSolution){state.showSolution=false;render();}else if(state.showCalcReason){state.showCalcReason=false;render();}return;}if(e.key==='Enter'&&e.target?.matches?.('[data-action="wheel-day"]')){e.preventDefault();action('wheel-day',e.target);return;}const s=state.session;if((state.page==='training'&&s?.type==='training'||state.page==='speed'&&s?.type==='speed')&&!s.finished){if(/^[1-7]$/.test(e.key)&&!e.ctrlKey&&!e.altKey&&!e.metaKey){e.preventDefault();answerQuestion(Number(e.key)-1);return;}if(e.key==='Enter'&&s.result){e.preventDefault();nextQuestion();return;}if(e.code==='Space'){e.preventDefault();pauseToggle();return;}}else if(e.code==='Space'&&state.page==='training'&&tag!=='button'){e.preventDefault();startSession('training');}});
function updateTimer(){const s=state.session;if(!s||s.finished||s.paused||s.result||!((state.page==='training'&&s.type==='training')||(state.page==='speed'&&s.type==='speed')))return;const timer=$('#live-timer');if(!timer)return;const elapsedSec=elapsed(s),max=s.config.seconds;timer.querySelector('.timer-digits').textContent=formatSeconds(elapsedSec);timer.classList.toggle('urgent',Boolean(max&&max-elapsedSec<=3));if(max&&elapsedSec>=max){answerQuestion(null);}}
setInterval(updateTimer,45);
render();
})();

  </script>
</body>
</html>
